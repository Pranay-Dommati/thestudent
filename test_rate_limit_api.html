<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rate Limit API Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        button { padding: 10px 20px; margin: 10px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; }
        .result { background: #f8f9fa; padding: 15px; border-radius: 5px; margin: 10px 0; max-height: 400px; overflow-y: auto; }
        .error { background: #f8d7da; color: #721c24; }
        .success { background: #d4edda; color: #155724; }
    </style>
</head>
<body>
    <h1>🧪 Rate Limit API Test</h1>
    
    <button onclick="testRateLimitStatus()">Test Rate Limit Status</button>
    <button onclick="testClassifyTopics()">Test Classify Topics</button>
    <button onclick="clearResults()">Clear Results</button>
    
    <div id="results"></div>

    <script>
        const BASE_URL = 'http://localhost:8000';
        
        function log(message, type = 'info') {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.innerHTML = `<strong>[${new Date().toLocaleTimeString()}]</strong> ${message}`;
            results.appendChild(div);
            results.scrollTop = results.scrollHeight;
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
        
        async function testRateLimitStatus() {
            log('🔍 Testing Rate Limit Status API...');
            
            try {
                const response = await fetch(`${BASE_URL}/api/ai/rate-limit-status/`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                });
                
                log(`📡 Response Status: ${response.status}`, response.ok ? 'success' : 'error');
                
                const data = await response.json();
                log(`📊 Response Data: <pre>${JSON.stringify(data, null, 2)}</pre>`, response.ok ? 'success' : 'error');
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }
        
        async function testClassifyTopics() {
            log('🔍 Testing Classify Topics API...');
            
            const testData = {
                query: "I want to learn about Python programming",
                max_topics: 2
            };
            
            try {
                const response = await fetch(`${BASE_URL}/api/ai/classify_topics/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(testData)
                });
                
                log(`📡 Response Status: ${response.status}`, response.ok ? 'success' : 'error');
                
                const data = await response.json();
                log(`📊 Response Data: <pre>${JSON.stringify(data, null, 2)}</pre>`, response.ok ? 'success' : 'error');
                
            } catch (error) {
                log(`❌ Error: ${error.message}`, 'error');
            }
        }
        
        // Test on page load
        window.onload = function() {
            log('🚀 Rate Limit API Tester loaded');
            log(`🔗 Testing against: ${BASE_URL}`);
        };
    </script>
</body>
</html>
