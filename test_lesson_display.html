<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Lesson Display</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .lesson { border: 1px solid #ccc; margin: 10px 0; padding: 15px; border-radius: 8px; }
        .lesson-header { background: #f5f5f5; padding: 10px; margin: -15px -15px 15px -15px; border-radius: 8px 8px 0 0; }
        .lesson-type { color: #666; font-size: 0.9em; }
        .about-content { background: #f9f9f9; padding: 10px; margin: 10px 0; border-radius: 4px; }
        .quiz-questions { background: #fff3cd; padding: 10px; margin: 10px 0; border-radius: 4px; }
    </style>
</head>
<body>
    <h1>English Course - Lesson Data Test</h1>
    <div id="lessons-container"></div>

    <script>
        // Test the actual API data
        async function testLessonData() {
            try {
                const response = await fetch('http://localhost:8000/api/courses/school/849668ee-1d4b-4e2e-8353-b76a4c94af41/');
                const courseData = await response.json();
                
                const container = document.getElementById('lessons-container');
                
                courseData.chapters.forEach(chapter => {
                    const chapterDiv = document.createElement('div');
                    chapterDiv.innerHTML = `<h2>Chapter: ${chapter.name}</h2>`;
                    container.appendChild(chapterDiv);
                    
                    chapter.lessons.forEach(lesson => {
                        const lessonDiv = document.createElement('div');
                        lessonDiv.className = 'lesson';
                        
                        let content = `
                            <div class="lesson-header">
                                <h3>${lesson.title}</h3>
                                <div class="lesson-type">Type: ${lesson.type}</div>
                            </div>
                        `;
                        
                        if (lesson.about_lesson) {
                            content += `
                                <div class="about-content">
                                    <strong>About Lesson:</strong><br>
                                    <pre style="white-space: pre-wrap; font-family: inherit;">${lesson.about_lesson}</pre>
                                </div>
                            `;
                        }
                        
                        if (lesson.description) {
                            content += `<p><strong>Description:</strong> ${lesson.description}</p>`;
                        }
                        
                        if (lesson.quiz_questions && lesson.quiz_questions.length > 0) {
                            content += `
                                <div class="quiz-questions">
                                    <strong>Quiz Questions (${lesson.quiz_questions.length}):</strong><br>
                                    ${lesson.quiz_questions.map((q, i) => `
                                        <div style="margin: 10px 0;">
                                            <strong>Q${i+1}:</strong> ${q.question}<br>
                                            <strong>Options:</strong> ${q.options.join(', ')}<br>
                                            <strong>Correct:</strong> ${q.correct_answer}
                                        </div>
                                    `).join('')}
                                </div>
                            `;
                        }
                        
                        if (lesson.video_url) {
                            content += `<p><strong>Video URL:</strong> ${lesson.video_url.substring(0, 100)}...</p>`;
                        }
                        
                        lessonDiv.innerHTML = content;
                        container.appendChild(lessonDiv);
                    });
                });
                
            } catch (error) {
                console.error('Error fetching lesson data:', error);
                document.getElementById('lessons-container').innerHTML = '<p>Error loading data: ' + error.message + '</p>';
            }
        }
        
        testLessonData();
    </script>
</body>
</html>
