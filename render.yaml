# Render Blueprint for Django Backend Deployment
# This configures the backend service on Render.com

services:
  # Django Backend Web Service
  - type: web
    name: easylearnova-backend
    runtime: python
    plan: free  # Change to 'starter' or higher for production
    region: oregon  # Choose closest to your users
    branch: dep-backend  # Deploy from this branch
    buildCommand: ./build.sh
    startCommand: cd backend && gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 360 --max-requests 200 --max-requests-jitter 20
    healthCheckPath: /api/chatbot/health/
    
    envVars:
      # Django Core Settings
      - key: PYTHON_VERSION
        value: 3.12.0
      
      - key: DEBUG
        value: False
      
      - key: SECRET_KEY
        generateValue: true  # Render will auto-generate a secure secret key
      
      - key: ALLOWED_HOSTS
        value: .onrender.com,easylearnova.com,www.easylearnova.com
      
      # Database - Hostinger MySQL (set these values manually in Render dashboard)
      - key: DB_ENGINE
        value: mysql
      
      - key: DB_HOST
        sync: false  # Set manually in Render dashboard
      
      - key: DB_PORT
        value: 3306
      
      - key: DB_NAME
        sync: false  # Set manually
      
      - key: DB_USER
        sync: false  # Set manually
      
      - key: DB_PASSWORD
        sync: false  # Set manually (use secret)
      
      - key: DB_SSL_REQUIRE
        value: false
      
      - key: DB_CONN_MAX_AGE
        value: 60
      
      # CORS and CSRF Settings
      - key: CORS_ALLOWED_ORIGINS
        value: https://easylearnova.com,https://www.easylearnova.com
      
      - key: CSRF_TRUSTED_ORIGINS
        value: https://easylearnova.com,https://www.easylearnova.com,https://easylearnova-backend.onrender.com
      
      # Frontend Domain
      - key: FRONTEND_DOMAIN
        value: https://www.easylearnova.com
      
      # API Keys (set these manually in Render dashboard)
      - key: YOUTUBE_API_KEY
        sync: false
      
      - key: GEMINI_API_KEY
        sync: false
      
      - key: GOOGLE_SEARCH_API_KEY
        sync: false
      
      - key: GOOGLE_SEARCH_ENGINE_ID
        sync: false
      
      # Google OAuth2 (set manually)
      - key: GOOGLE_OAUTH2_CLIENT_ID
        sync: false
      
      - key: GOOGLE_OAUTH2_CLIENT_SECRET
        sync: false
      
      # AWS SES API Settings (set manually in Render dashboard)
      - key: AWS_ACCESS_KEY_ID
        sync: false
      
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      
      - key: AWS_REGION
        value: ap-south-1
      
      - key: DEFAULT_FROM_EMAIL
        value: info@easylearnova.com
      
      # SMTP Settings for emails (DEPRECATED - using AWS SES API instead)
      - key: SMTP_HOST
        sync: false
      
      - key: SMTP_PORT
        value: 465
      
      - key: SMTP_USERNAME
        sync: false
      
      - key: SMTP_PASSWORD
        sync: false
      
      - key: SMTP_USE_SSL
        value: true
      
      - key: SMTP_USE_TLS
        value: false
      
      # JWT Settings
      - key: JWT_ACCESS_MINUTES
        value: 60
      
      - key: JWT_REFRESH_DAYS
        value: 7
      
      # Rate Limiting
      - key: MAX_TOPICS_PER_MONTH
        value: 15
      
      - key: MAX_TOPICS_PER_REQUEST
        value: 4
      
      - key: ENFORCE_DAILY_LIMIT
        value: false
      
      # Cookie Settings for Production
      - key: SESSION_COOKIE_SAMESITE
        value: None
      
      - key: CSRF_COOKIE_SAMESITE
        value: None
      
      - key: SESSION_COOKIE_SECURE
        value: true
      
      - key: CSRF_COOKIE_SECURE
        value: true
      
      # Security Headers
      - key: SECURE_SSL_REDIRECT
        value: true
      
      - key: SECURE_CROSS_ORIGIN_OPENER_POLICY
        value: same-origin-allow-popups
      
      # Logging
      - key: DJANGO_LOG_LEVEL
        value: INFO
