# Render Blueprint for Django Backend Deployment
# This configures the backend service on Render.com

services:
  # Django Backend Web Service
  - type: web
    name: easylearnova-backend
    runtime: python
    plan: standard
    region: singapore
    branch: dep-backend  # Deploy from this branch
    buildCommand: ./build.sh
    startCommand: cd backend && gunicorn backend.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --worker-class gevent --worker-connections 100 --timeout 30 --max-requests 500 --max-requests-jitter 50 --keep-alive 5
    healthCheckPath: /api/chatbot/health/
    
    envVars:
      # Django Core Settings
      - key: PYTHON_VERSION
        value: 3.12.0
      
      - key: DEBUG
        value: False
      
      - key: SECRET_KEY
        generateValue: true  # Render will auto-generate a secure secret key
      
      - key: ALLOWED_HOSTS
        value: .onrender.com,easylearnova.com,www.easylearnova.com
      
      # Database - Hostinger MySQL (set these values manually in Render dashboard)
      - key: DB_ENGINE
        value: mysql
      
      - key: DB_HOST
        sync: false  # Set manually in Render dashboard
      
      - key: DB_PORT
        value: 3306
      
      - key: DB_NAME
        sync: false  # Set manually
      
      - key: DB_USER
        sync: false  # Set manually
      
      - key: DB_PASSWORD
        sync: false  # Set manually (use secret)
      
      - key: DB_SSL_REQUIRE
        value: false
      
      - key: DB_CONN_MAX_AGE
        value: 60
      
      # CORS and CSRF Settings
      - key: CORS_ALLOWED_ORIGINS
        value: https://easylearnova.com,https://www.easylearnova.com,https://scrib.easylearnova.com
      
      - key: CSRF_TRUSTED_ORIGINS
        value: https://easylearnova.com,https://www.easylearnova.com,https://scrib.easylearnova.com,https://easylearnova-backend.onrender.com
      
      # Frontend Domain
      - key: FRONTEND_DOMAIN
        value: https://www.easylearnova.com
      
      # API Keys (set these manually in Render dashboard)
      - key: YOUTUBE_API_KEY
        sync: false
      
      - key: GEMINI_API_KEY
        sync: false
      
      - key: GOOGLE_SEARCH_API_KEY
        sync: false
      
      - key: GOOGLE_SEARCH_ENGINE_ID
        sync: false
      
      # Google OAuth2 (set manually)
      - key: GOOGLE_OAUTH2_CLIENT_ID
        sync: false
      
      - key: GOOGLE_OAUTH2_CLIENT_SECRET
        sync: false
      
      # AWS SES API Settings (set manually in Render dashboard)
      - key: AWS_ACCESS_KEY_ID
        sync: false
      
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      
      - key: AWS_REGION
        value: ap-south-1
      
      - key: DEFAULT_FROM_EMAIL
        value: info@easylearnova.com
      
      # SMTP Settings for emails (DEPRECATED - using AWS SES API instead)
      - key: SMTP_HOST
        sync: false
      
      - key: SMTP_PORT
        value: 465
      
      - key: SMTP_USERNAME
        sync: false
      
      - key: SMTP_PASSWORD
        sync: false
      
      - key: SMTP_USE_SSL
        value: true
      
      - key: SMTP_USE_TLS
        value: false
      
      # JWT Settings
      - key: JWT_ACCESS_MINUTES
        value: 60
      
      - key: JWT_REFRESH_DAYS
        value: 7
      
      # Rate Limiting
      - key: MAX_TOPICS_PER_MONTH
        value: 15
      
      - key: MAX_TOPICS_PER_REQUEST
        value: 4
      
      - key: ENFORCE_DAILY_LIMIT
        value: false
      
      # Cookie Settings for Production
      - key: SESSION_COOKIE_SAMESITE
        value: None
      
      - key: CSRF_COOKIE_SAMESITE
        value: None
      
      - key: SESSION_COOKIE_SECURE
        value: true
      
      - key: CSRF_COOKIE_SECURE
        value: true
      
      # Security Headers
      - key: SECURE_SSL_REDIRECT
        value: true
      
      - key: SECURE_CROSS_ORIGIN_OPENER_POLICY
        value: same-origin-allow-popups
      
      # Logging
      - key: DJANGO_LOG_LEVEL
        value: INFO

      # Redis / Celery - set these manually in the Render dashboard
      # Get the "Internal Redis URL" from your easylearnova-redis service Info tab.
      # It will look like:  redis://red-xxxxxxxxxxxx:6379
      - key: REDIS_URL
        sync: false

      - key: CELERY_BROKER_URL
        sync: false

      - key: CELERY_RESULT_BACKEND
        sync: false

  # Celery Worker Service
  # Handles PDF generation completely outside gunicorn.
  # Gunicorn timeouts can NEVER kill this process.
  #
  # NOTE: `name` must stay in sync with the service name in the Render dashboard
  # — Render binds blueprint entries to services by name, and a mismatch means
  # these settings silently never apply, which is exactly what happened between
  # de8b9a42 and now.
  #
  # --concurrency=2  a 24-page pack peaks around 520MB RSS and each pool child is
  #   its own process: 2 x 520MB ~= 1.04GB fits the 2GB plan with headroom,
  #   3 is tight (~1.7GB with the parent), 4 exceeds it outright.
  # --max-tasks-per-child=10  recycles the process every 10 tasks to flush leaks.
  - type: worker
    name: thestudent
    runtime: python
    plan: standard
    region: singapore
    branch: dep-backend
    buildCommand: ./build.sh
    startCommand: cd backend && celery -A backend worker --loglevel=info --concurrency=2 --max-tasks-per-child=10
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: False
      - key: SECRET_KEY
        sync: false  # Must match the web service SECRET_KEY - set manually
      - key: ALLOWED_HOSTS
        value: .onrender.com,easylearnova.com,www.easylearnova.com
      - key: DB_ENGINE
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: 3306
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL_REQUIRE
        value: false
      - key: DB_CONN_MAX_AGE
        value: 60
      - key: REDIS_URL
        sync: false
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        value: ap-south-1
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-1
      - key: DJANGO_LOG_LEVEL
        value: INFO
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: SCRIB_S3_ACCESS_KEY_ID
        sync: false
      - key: SCRIB_S3_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
