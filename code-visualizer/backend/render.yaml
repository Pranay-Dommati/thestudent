# Render Blueprint for Code Visualizer Backend
# This file configures the service for deployment on Render

services:
  - type: web
    name: code-visualizer-backend
    runtime: python
    rootDir: code-visualizer/backend
    buildCommand: chmod +x start.sh && pip install -r requirements.txt
    startCommand: ./start.sh
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.4"
      - key: GEMINI_API_KEY
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: BACKEND_URL
        value: "http://localhost:$PORT"
    healthCheckPath: /api/health
