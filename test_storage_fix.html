<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storage System Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .success { color: green; }
        .error { color: red; }
        .info { color: blue; }
        .test-section { margin: 20px 0; padding: 10px; border: 1px solid #ccc; }
    </style>
</head>
<body>
    <h1>Pro Learning Storage System Test</h1>
    
    <div class="test-section">
        <h2>Test Results</h2>
        <div id="test-results"></div>
    </div>

    <div class="test-section">
        <h2>Navigate to Pro Learning</h2>
        <button onclick="openProLearning()">Open Pro Learning with Test Course</button>
    </div>

    <script>
        const results = document.getElementById('test-results');
        
        function log(message, type = 'info') {
            const div = document.createElement('div');
            div.className = type;
            div.textContent = message;
            results.appendChild(div);
        }

        // Test 1: Check if we can access localStorage
        try {
            localStorage.setItem('test', 'value');
            localStorage.removeItem('test');
            log('✅ localStorage access working', 'success');
        } catch (error) {
            log('❌ localStorage access failed: ' + error.message, 'error');
        }

        // Test 2: Check if Pro Learning storage exists
        try {
            const storage = localStorage.getItem('proLearning_storage');
            if (storage) {
                const parsed = JSON.parse(storage);
                log(`✅ Pro Learning storage found with ${Object.keys(parsed.courses || {}).length} courses`, 'success');
            } else {
                log('ℹ️ No existing Pro Learning storage found (this is normal)', 'info');
            }
        } catch (error) {
            log('❌ Error reading Pro Learning storage: ' + error.message, 'error');
        }

        // Test 3: Check if old contentCache exists (should be cleaned up)
        try {
            const oldCache = localStorage.getItem('proLearning_contentCache');
            if (oldCache) {
                log('⚠️ Old contentCache found - should be cleaned up', 'error');
            } else {
                log('✅ No old contentCache found (cleaned up successfully)', 'success');
            }
        } catch (error) {
            log('❌ Error checking old cache: ' + error.message, 'error');
        }

        function openProLearning() {
            const url = '/pro-learning?courseTitle=JavaScript%20Fundamentals';
            window.open(url, '_blank');
        }

        log('Storage system test completed', 'info');
    </script>
</body>
</html>
