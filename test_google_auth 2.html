<!DOCTYPE html>
<html>
<head>
    <title>Google OAuth Test</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <h1>Google OAuth Test</h1>
    <div id="g_id_onload"
         data-client_id="3298640481-nn5k7psok2t4nlj30193uo9p2acjf7nq.apps.googleusercontent.com"
         data-context="signin"
         data-ux_mode="popup"
         data-callback="handleCredentialResponse">
    </div>
    
    <div class="g_id_signin" data-type="standard"></div>
    
    <script>
        function handleCredentialResponse(response) {
            console.log("Encoded JWT ID token: " + response.credential);
            alert("Google Sign-In successful! Check console for token.");
        }
        
        // Initialize Google Sign-In when page loads
        window.onload = function() {
            google.accounts.id.initialize({
                client_id: '3298640481-nn5k7psok2t4nlj30193uo9p2acjf7nq.apps.googleusercontent.com',
                callback: handleCredentialResponse
            });
            google.accounts.id.renderButton(
                document.querySelector('.g_id_signin'),
                { theme: 'outline', size: 'large' }
            );
        }
    </script>
</body>
</html>
