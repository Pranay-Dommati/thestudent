# Docker MySQL Setup for Students Hub
# Removed obsolete version key and fixed environment variable interpolation

services:
  mysql:
    image: public.ecr.aws/docker/library/mysql:8.0
    container_name: studentshub_mysql
    env_file:
      - .env
    environment:
      MYSQL_DATABASE: ${DB_NAME}        # taken from .env
      MYSQL_USER: ${DB_USER}            # taken from .env
      MYSQL_PASSWORD: ${DB_PASSWORD}    # taken from .env
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpass123}  # taken from .env or default
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
