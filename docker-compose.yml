# Docker PostgreSQL Setup for Students Hub

version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: studentshub_postgres
    environment:
      POSTGRES_DB: studentshub_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: studentshub123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  postgres_data:
