# Docker PostgreSQL Setup for Students Hub
# Removed obsolete version key and fixed environment variable interpolation

services:
  postgres:
    image: postgres:15
    container_name: studentshub_postgres
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${DB_NAME}        # taken from .env
      POSTGRES_USER: ${DB_USER}      # taken from .env
      POSTGRES_PASSWORD: ${DB_PASSWORD}  # taken from .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
