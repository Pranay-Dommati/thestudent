<!DOCTYPE html>
<html>
<head>
    <title>Test Learning Stats API</title>
</head>
<body>
    <h1>Test Learning Stats API</h1>
    <button onclick="setToken()">1. Set Test Token</button>
    <br><br>
    <button onclick="testAPI()">2. Test API Call</button>
    <br><br>
    <div id="output"></div>

    <script>
        function setToken() {
            // Use the token we generated earlier
            const token = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ0b2tlbl90eXBlIjoiYWNjZXNzIiwiZXhwIjoxNzU0MTM5Mzk1LCJpYXQiOjE3NTQwNTI5OTUsImp0aSI6IjkzNTJhNzVjMWVlNzRiMWQ5NDI1MDE4MDI1NmI2YTVlIiwidXNlcl9pZCI6Nn0.KA6_O5VDu3X3SMl15lZphExi9PVDxTWgGuM9mzf_oGs';
            localStorage.setItem('accessToken', token);
            document.getElementById('output').innerHTML = '✅ Token set in localStorage as "accessToken"';
        }

        async function testAPI() {
            try {
                const token = localStorage.getItem('accessToken');
                if (!token) {
                    document.getElementById('output').innerHTML = '❌ No token found in localStorage';
                    return;
                }

                console.log('🔐 Token available:', !!token);
                console.log('🔐 Token preview:', token.substring(0, 20) + '...');

                const response = await fetch('http://localhost:8000/api/courses/learning-stats/', {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });

                console.log('📡 Response status:', response.status);
                const data = await response.json();
                console.log('📡 Response data:', data);

                document.getElementById('output').innerHTML = `
                    <h3>API Response:</h3>
                    <pre>${JSON.stringify(data, null, 2)}</pre>
                `;
            } catch (error) {
                console.error('❌ Error:', error);
                document.getElementById('output').innerHTML = `❌ Error: ${error.message}`;
            }
        }
    </script>
</body>
</html>
