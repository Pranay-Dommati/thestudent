<!DOCTYPE html>
<html>
<head>
    <title>Debug Learning Stats</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
        button { padding: 10px 15px; margin: 5px; border: none; border-radius: 3px; cursor: pointer; }
        .btn-primary { background-color: #007bff; color: white; }
        .btn-success { background-color: #28a745; color: white; }
    </style>
</head>
<body>
    <h1>🔍 Learning Stats Debug Tool</h1>
    
    <div class="section info">
        <h2>Step 1: Check Authentication</h2>
        <button class="btn-primary" onclick="checkAuth()">Check Auth Status</button>
        <div id="authResult"></div>
    </div>
    
    <div class="section info">
        <h2>Step 2: Test Manual Login</h2>
        <input type="email" id="email" value="example20@gmail.com" placeholder="Email">
        <input type="password" id="password" value="testpassword123" placeholder="Password">
        <button class="btn-primary" onclick="login()">Login</button>
        <div id="loginResult"></div>
    </div>
    
    <div class="section info">
        <h2>Step 3: Test Learning Stats API</h2>
        <button class="btn-success" onclick="testLearningStats()">Get Learning Stats</button>
        <div id="statsResult"></div>
    </div>
    
    <div class="section info">
        <h2>Step 4: Test Complete Flow</h2>
        <button class="btn-success" onclick="testCompleteFlow()">Test Complete Flow</button>
        <div id="flowResult"></div>
    </div>

    <script>
        const API_URL = 'http://localhost:8000';
        
        function log(message, elementId, type = 'info') {
            const element = document.getElementById(elementId);
            const timestamp = new Date().toLocaleTimeString();
            const className = type === 'error' ? 'error' : type === 'success' ? 'success' : 'info';
            element.innerHTML += `<div class="${className}"><strong>[${timestamp}]</strong> ${message}</div>`;
            console.log(`[${timestamp}] ${message}`);
        }
        
        function checkAuth() {
            const authResult = document.getElementById('authResult');
            authResult.innerHTML = '';
            
            const token = localStorage.getItem('accessToken');
            log(`🔍 Token exists: ${!!token}`, 'authResult');
            
            if (token) {
                log(`🔍 Token preview: ${token.substring(0, 50)}...`, 'authResult');
                log(`🔍 Token length: ${token.length}`, 'authResult');
                
                // Try to decode JWT payload (without verification)
                try {
                    const payload = JSON.parse(atob(token.split('.')[1]));
                    log(`🔍 Token payload: <pre>${JSON.stringify(payload, null, 2)}</pre>`, 'authResult');
                    
                    const expiry = new Date(payload.exp * 1000);
                    const now = new Date();
                    log(`🔍 Token expires: ${expiry.toLocaleString()}`, 'authResult');
                    log(`🔍 Token valid: ${expiry > now ? 'YES' : 'EXPIRED'}`, 'authResult', expiry > now ? 'success' : 'error');
                } catch (e) {
                    log(`❌ Could not decode token: ${e.message}`, 'authResult', 'error');
                }
            } else {
                log('❌ No access token found in localStorage', 'authResult', 'error');
            }
            
            // Check all localStorage keys
            const allKeys = Object.keys(localStorage);
            log(`🔍 All localStorage keys: ${allKeys.join(', ')}`, 'authResult');
        }
        
        async function login() {
            const loginResult = document.getElementById('loginResult');
            loginResult.innerHTML = '';
            
            try {
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                
                log(`🔐 Attempting login for: ${email}`, 'loginResult');
                
                const response = await fetch(`${API_URL}/api/auth/login/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email, password })
                });
                
                log(`🔐 Login response status: ${response.status}`, 'loginResult');
                
                const data = await response.json();
                log(`🔐 Login response: <pre>${JSON.stringify(data, null, 2)}</pre>`, 'loginResult');
                
                if (data.access) {
                    localStorage.setItem('accessToken', data.access);
                    log('✅ Login successful! Token stored in localStorage', 'loginResult', 'success');
                } else {
                    log('❌ Login failed - no access token received', 'loginResult', 'error');
                }
            } catch (error) {
                log(`❌ Login error: ${error.message}`, 'loginResult', 'error');
            }
        }
        
        async function testLearningStats() {
            const statsResult = document.getElementById('statsResult');
            statsResult.innerHTML = '';
            
            try {
                const token = localStorage.getItem('accessToken');
                if (!token) {
                    log('❌ No token found. Please login first.', 'statsResult', 'error');
                    return;
                }
                
                log(`📊 Testing learning stats API...`, 'statsResult');
                log(`📊 Using token: ${token.substring(0, 30)}...`, 'statsResult');
                
                const response = await fetch(`${API_URL}/api/courses/learning-stats/`, {
                    headers: {
                        'Authorization': `Bearer ${token}`,
                        'Content-Type': 'application/json'
                    }
                });
                
                log(`📊 API response status: ${response.status}`, 'statsResult');
                
                const data = await response.json();
                log(`📊 API response data: <pre>${JSON.stringify(data, null, 2)}</pre>`, 'statsResult');
                
                if (data.success && data.data) {
                    log(`✅ Learning stats received successfully!`, 'statsResult', 'success');
                    log(`📊 Weekly hours: ${data.data.weekly_hours}`, 'statsResult', 'success');
                    log(`📊 Current streak: ${data.data.current_streak}`, 'statsResult', 'success');
                } else {
                    log(`❌ API call successful but no valid data received`, 'statsResult', 'error');
                }
            } catch (error) {
                log(`❌ Error testing learning stats: ${error.message}`, 'statsResult', 'error');
            }
        }
        
        async function testCompleteFlow() {
            const flowResult = document.getElementById('flowResult');
            flowResult.innerHTML = '';
            
            log(`🚀 Testing complete flow...`, 'flowResult');
            
            // Step 1: Check auth
            const token = localStorage.getItem('accessToken');
            if (!token) {
                log(`❌ No token - attempting login first`, 'flowResult');
                await login();
            }
            
            // Step 2: Test API
            log(`🔄 Testing API with current token...`, 'flowResult');
            await testLearningStats();
            
            log(`✅ Complete flow test finished`, 'flowResult', 'success');
        }
        
        // Auto-check auth on page load
        window.onload = function() {
            checkAuth();
        };
    </script>
</body>
</html>
