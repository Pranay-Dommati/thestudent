<!DOCTYPE html>
<html>
<head>
    <title>Test Quiz Data</title>
</head>
<body>
    <h1>Testing Course Data</h1>
    <button onclick="testCourseApi()">Test Course API</button>
    <pre id="output"></pre>

    <script>
        async function testCourseApi() {
            const output = document.getElementById('output');
            try {
                // Test the course list endpoint
                const listResponse = await fetch('http://127.0.0.1:8000/api/courses/school/?class=10th&board=cbse&subject=english');
                const courseList = await listResponse.json();
                console.log('Course list:', courseList);
                
                if (courseList.length > 0) {
                    const courseId = courseList[0].id;
                    console.log('Course ID:', courseId);
                    
                    // Test the course details endpoint
                    const detailResponse = await fetch(`http://127.0.0.1:8000/api/courses/school/${courseId}/`);
                    const courseDetails = await detailResponse.json();
                    console.log('Course details:', courseDetails);
                    
                    // Check the lesson data
                    const firstLesson = courseDetails.chapters[0].lessons[0];
                    console.log('First lesson:', firstLesson);
                    
                    output.textContent = JSON.stringify({
                        courseId,
                        lessonType: firstLesson.type,
                        hasQuizQuestions: !!firstLesson.quiz_questions,
                        quizQuestionsCount: firstLesson.quiz_questions?.length || 0,
                        hasAboutLesson: !!firstLesson.about_lesson,
                        aboutLessonLength: firstLesson.about_lesson?.length || 0
                    }, null, 2);
                }
            } catch (error) {
                console.error('Error:', error);
                output.textContent = 'Error: ' + error.message;
            }
        }
    </script>
</body>
</html>
